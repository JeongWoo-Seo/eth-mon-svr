syntax = "proto3";

package gas_monitoring;

option go_package = "github.com/JeongWoo-Seo/eth-mon-svr/internal/pb";

import "google/protobuf/timestamp.proto";

message GasLevel {
    uint64 priority_fee = 1;
    uint64 max_fee = 2;
}

message GasPredictionStream {
    oneof event {
        GasPredictionRequest prediction = 1;
        GapEvent gap = 2;
    }
}

message GasPredictionRequest {
    uint64 next_block_number = 1;
    uint64 next_base_fee = 2;
    map<string, GasLevel> predict_result = 3;
    google.protobuf.Timestamp updated_at = 4;
}

message GapEvent {
    uint64 from_block = 1;
    uint64 to_block = 2;
    google.protobuf.Timestamp detected_at = 3;
  
    enum Reason {
        UNKNOW = 0;
        RECONNECT = 1;
        WS_DISCONECTED = 2;
    }

    Reason reason = 4;
}

message GasPredictionResponse {
    bool success = 1;
    string message = 2;
    uint64 ack_block = 3;
}